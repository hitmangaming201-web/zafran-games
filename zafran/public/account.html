<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account — ZafranGames</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1f3c;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh;padding-bottom:70px}
.header{background:#1e2547;padding:14px 16px;text-align:center;font-size:17px;font-weight:700}
.profile-card{background:linear-gradient(135deg,#2d3875,#1e2547);margin:14px;border-radius:16px;padding:20px}
.unverified-badge{background:#cc6600;color:#fff;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;display:inline-block;margin-bottom:12px}
.uid-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.avatar{width:52px;height:52px;background:#f5a623;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#1a1f3c}
.uid-info h3{font-size:16px;font-weight:700}
.uid-info p{font-size:12px;color:#a0aec0}
.balance-row{display:flex;gap:12px}
.bal-box{flex:1;background:rgba(255,255,255,0.08);border-radius:12px;padding:12px;text-align:center}
.bal-box .label{font-size:11px;color:#a0aec0;margin-bottom:4px}
.bal-box .amount{font-size:20px;font-weight:800;color:#f5a623}
.action-row{display:flex;gap:10px;margin:0 14px 14px}
.action-btn{flex:1;border-radius:12px;padding:14px;text-align:center;cursor:pointer;font-weight:700;font-size:14px;border:none}
.btn-deposit{background:#f5a623;color:#1a1f3c}
.btn-withdraw{background:#2a3060;color:#f5a623;border:2px solid #f5a623}
.menu-section{background:#2a3060;margin:0 14px 10px;border-radius:14px;overflow:hidden}
.menu-item{display:flex;align-items:center;padding:16px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer}
.menu-item:last-child{border-bottom:none}
.menu-icon{font-size:20px;margin-right:14px}
.menu-label{flex:1;font-size:14px;font-weight:500}
.menu-arrow{color:#606890}
.logout-btn{margin:14px;width:calc(100% - 28px);background:#3a1a1a;border:1px solid #cc3333;color:#ff6666;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#1e2547;border-top:1px solid #2a3060;display:flex;padding:8px 0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px;text-decoration:none;color:#a0aec0}
.nav-item.active{color:#f5a623}
.nav-icon{font-size:20px}
.nav-label{font-size:10px;font-weight:600}
</style>
</head>
<body>
<div class="header">My Account</div>

<div id="guestView" style="padding:40px 20px;text-align:center;display:none">
  <div style="font-size:48px;margin-bottom:16px">👤</div>
  <p style="color:#a0aec0;margin-bottom:20px">Please login to view your account</p>
  <button onclick="window.location.href='login.html'" style="background:#f5a623;color:#1a1f3c;border:none;border-radius:24px;padding:12px 32px;font-weight:700;font-size:15px;cursor:pointer">Login Now</button>
</div>

<div id="userView">
  <div class="profile-card">
    <div class="unverified-badge">UNVERIFIED</div>
    <div class="uid-row">
      <div class="avatar" id="avatarLetter">?</div>
      <div class="uid-info">
        <h3 id="usernameDisplay">Loading...</h3>
        <p id="uidDisplay">UID: ------</p>
      </div>
    </div>
    <div class="balance-row">
      <div class="bal-box"><div class="label">Balance</div><div class="amount" id="balDisplay">₹0.00</div></div>
      <div class="bal-box"><div class="label">Total Deposited</div><div class="amount" id="depDisplay">₹0.00</div></div>
    </div>
  </div>

  <div class="action-row">
    <button class="action-btn btn-deposit" onclick="window.location.href='deposit.html'">💰 Deposit</button>
    <button class="action-btn btn-withdraw" onclick="window.location.href='withdraw.html'">🏦 Withdraw</button>
  </div>

  <div class="menu-section">
    <div class="menu-item" onclick="window.location.href='withdraw.html'"><span class="menu-icon">📤</span><span class="menu-label">Withdrawal</span><span class="menu-arrow">›</span></div>
    <div class="menu-item" onclick="window.location.href='history.html'"><span class="menu-icon">📋</span><span class="menu-label">Transaction History</span><span class="menu-arrow">›</span></div>
    <div class="menu-item"><span class="menu-icon">🎁</span><span class="menu-label">Bonuses & Promotions</span><span class="menu-arrow">›</span></div>
    <div class="menu-item"><span class="menu-icon">🔒</span><span class="menu-label">Security Settings</span><span class="menu-arrow">›</span></div>
    <div class="menu-item"><span class="menu-icon">📞</span><span class="menu-label">Customer Support</span><span class="menu-arrow">›</span></div>
  </div>

  <button class="logout-btn" onclick="doLogout()">🚪 Logout</button>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
  <a href="#" class="nav-item"><span class="nav-icon">🎁</span><span class="nav-label">Activity</span></a>
  <a href="deposit.html" class="nav-item"><span class="nav-icon">💰</span><span class="nav-label">Wallet</span></a>
  <a href="account.html" class="nav-item active"><span class="nav-icon">👤</span><span class="nav-label">Account</span></a>
</nav>

<script>
const token=localStorage.getItem('zg_token');
if(!token){document.getElementById('guestView').style.display='block';document.getElementById('userView').style.display='none';}
else{
  document.getElementById('guestView').style.display='none';
  fetch('/api/auth/profile',{headers:{'Authorization':'Bearer '+token}})
    .then(r=>r.json()).then(u=>{
      const name=u.phone||u.email||'User';
      document.getElementById('usernameDisplay').textContent=name;
      document.getElementById('uidDisplay').textContent='UID: '+u.uid;
      document.getElementById('balDisplay').textContent='₹'+parseFloat(u.balance||0).toFixed(2);
      document.getElementById('depDisplay').textContent='₹'+parseFloat(u.totalDeposited||0).toFixed(2);
      document.getElementById('avatarLetter').textContent=name[0].toUpperCase();
    }).catch(()=>{});
}
function doLogout(){localStorage.removeItem('zg_token');localStorage.removeItem('zg_user');window.location.href='index.html';}
</script>
</body>
</html>
