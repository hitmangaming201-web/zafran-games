<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator — ZafranGames</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="navbar">
  <a href="index.html" style="color:var(--text2);text-decoration:none;font-size:20px;">←</a>
  <div style="font-weight:900;font-size:16px;letter-spacing:1px;">✈️ AVIATOR</div>
  <div id="navBal" style="color:var(--gold);font-weight:700;font-size:13px;"></div>
</div>
<div class="page">
  <div class="aviator-sky" id="sky">
    <canvas id="aviatorCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;"></canvas>
    <div style="position:relative;text-align:center;z-index:2;">
      <div class="multiplier-display" id="multiplier">1.00×</div>
      <div style="color:var(--text2);font-size:13px;margin-top:6px;" id="status">Waiting for next round...</div>
    </div>
  </div>

  <!-- Recent crashes ticker -->
  <div style="display:flex;gap:5px;overflow-x:auto;padding:8px 0;scrollbar-width:none;" id="ticker"></div>

  <div class="card">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
      <button onclick="setBet(10)" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:16px;cursor:pointer;font-size:12px;font-weight:600;">₹10</button>
      <button onclick="setBet(50)" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:16px;cursor:pointer;font-size:12px;font-weight:600;">₹50</button>
      <button onclick="setBet(100)" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:16px;cursor:pointer;font-size:12px;font-weight:600;">₹100</button>
      <button onclick="setBet(500)" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:16px;cursor:pointer;font-size:12px;font-weight:600;">₹500</button>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:12px;">
      <div style="flex:1;">
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">Bet (₹)</label>
        <input type="number" class="input-field" id="betAmt" value="10" min="1">
      </div>
      <div style="flex:1;">
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">Auto Cashout</label>
        <input type="number" class="input-field" id="cashoutAt" value="2.00" min="1.01" step="0.01">
      </div>
    </div>
    <div id="alertBox" style="margin-bottom:8px;"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" id="betBtn" onclick="placeBet()" style="flex:1;">BET</button>
      <button class="btn btn-green" id="cashoutBtn" onclick="manualCashout()" disabled style="flex:1;opacity:0.4;">CASHOUT</button>
    </div>
  </div>

  <div class="card" style="margin-top:8px;">
    <div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600;">Recent Crashes</div>
    <div id="recentResults" style="display:flex;flex-wrap:wrap;gap:5px;"></div>
  </div>
</div>
<script src="js/aviator.js"></script>
</body>
</html>
