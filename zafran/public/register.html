<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — ZafranGames</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1f3c;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh;padding-bottom:30px}
.top-bar{background:#1e2547;padding:14px 16px;display:flex;align-items:center;gap:12px}
.back-btn{font-size:20px;cursor:pointer;color:#a0aec0}
.logo{font-size:20px;font-weight:800;color:#f5a623}
.logo span{color:#fff}
.hero{background:linear-gradient(135deg,#1e2547,#2d3875);padding:24px 20px;text-align:center}
.hero h1{font-size:26px;font-weight:800}
.hero p{color:#a0aec0;font-size:13px;margin-top:4px}
.bonus-banner{background:linear-gradient(135deg,#2d6a10,#4a9a1a);margin:14px;border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:14px}
.bonus-banner .icon{font-size:32px}
.bonus-banner h3{font-size:17px;font-weight:800}
.bonus-banner p{font-size:12px;opacity:0.9;margin-top:2px}
.form-wrap{padding:0 16px}
.input-group{background:#2a3060;border-radius:12px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.input-group .icon{font-size:18px;color:#a0aec0}
.input-group input{background:transparent;border:none;outline:none;color:#fff;font-size:15px;flex:1}
.input-group input::placeholder{color:#606890}
.btn-reg{width:100%;background:#f5a623;color:#1a1f3c;border:none;border-radius:24px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;margin:4px 0 16px}
.bottom-link{text-align:center;color:#a0aec0;font-size:13px}
.bottom-link a{color:#f5a623;font-weight:700;text-decoration:none}
.error-msg{background:#3a1a1a;border:1px solid #cc3333;border-radius:8px;padding:10px 14px;color:#ff6666;font-size:13px;margin-bottom:12px;display:none}
.success-msg{background:#1a3010;border:1px solid #2d7a10;border-radius:8px;padding:10px 14px;color:#7dda3a;font-size:13px;margin-bottom:12px;display:none}
.terms{color:#606890;font-size:11px;text-align:center;margin-bottom:16px}
</style>
</head>
<body>
<div class="top-bar">
  <span class="back-btn" onclick="history.back()">←</span>
  <div class="logo">Zafran<span>Games</span></div>
</div>
<div class="hero">
  <h1>Create Account</h1>
  <p>Register your phone number to start playing</p>
</div>

<div class="bonus-banner">
  <div class="icon">🎁</div>
  <div>
    <h3>Get ₹40 FREE on Signup!</h3>
    <p>Bonus credited automatically to your wallet</p>
  </div>
</div>

<div class="form-wrap">
  <div class="input-group">
    <span class="icon">🇮🇳</span>
    <span style="color:#a0aec0;font-size:14px">+91</span>
    <input type="tel" id="phoneInput" placeholder="Enter phone number" maxlength="10">
  </div>
  <div class="input-group">
    <span class="icon">🔒</span>
    <input type="password" id="passInput" placeholder="Set password (min 6 chars)">
    <span style="cursor:pointer;color:#a0aec0" onclick="togglePass('passInput')">👁</span>
  </div>
  <div class="input-group">
    <span class="icon">🔒</span>
    <input type="password" id="pass2Input" placeholder="Confirm password">
    <span style="cursor:pointer;color:#a0aec0" onclick="togglePass('pass2Input')">👁</span>
  </div>
  <div class="input-group">
    <span class="icon">🎟</span>
    <input type="text" id="inviteInput" placeholder="Invite code (optional)">
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>
  <div class="terms">By registering, you agree to our Terms & Conditions. Must be 18+ to play.</div>
  <button class="btn-reg" onclick="doRegister()">Register & Get ₹40 Bonus 🎁</button>
  <div class="bottom-link">Already have an account? <a href="login.html">Login</a></div>
</div>

<script>
function togglePass(id){const p=document.getElementById(id);p.type=p.type==='password'?'text':'password';}
async function doRegister(){
  const phone=document.getElementById('phoneInput').value.trim();
  const pass=document.getElementById('passInput').value;
  const pass2=document.getElementById('pass2Input').value;
  const invite=document.getElementById('inviteInput').value.trim();
  if(!phone||phone.length!==10){showErr('Enter valid 10-digit phone number');return;}
  if(!pass||pass.length<6){showErr('Password must be at least 6 characters');return;}
  if(pass!==pass2){showErr('Passwords do not match');return;}
  try{
    const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:'+91'+phone,password:pass,inviteCode:invite||undefined})});
    const d=await r.json();
    if(!r.ok){showErr(d.msg||'Registration failed');return;}
    localStorage.setItem('zg_token',d.token);
    localStorage.setItem('zg_user',JSON.stringify({uid:d.uid,balance:40}));
    document.getElementById('successMsg').textContent='🎉 Account created! ₹40 bonus added to your wallet!';
    document.getElementById('successMsg').style.display='block';
    setTimeout(()=>window.location.href='index.html',1500);
  }catch(e){showErr('Network error. Try again.');}
}
function showErr(m){const el=document.getElementById('errorMsg');el.textContent=m;el.style.display='block';}
</script>
</body>
</html>
