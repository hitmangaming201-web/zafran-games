<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mines — ZafranGames</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="navbar">
  <a href="index.html" style="color:var(--text2);text-decoration:none;font-size:20px;">←</a>
  <div style="font-weight:900;font-size:16px;letter-spacing:1px;">💣 MINES</div>
  <div id="navBal" style="color:var(--gold);font-weight:700;font-size:13px;"></div>
</div>
<div class="page">
  <div class="card" style="margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;">
      <div>
        <div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;">Multiplier</div>
        <div id="currentMult" style="color:var(--green);font-size:30px;font-weight:900;letter-spacing:-1px;">1.00×</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;">Potential Win</div>
        <div id="potWin" style="color:var(--gold);font-size:22px;font-weight:900;">₹0.00</div>
      </div>
    </div>
  </div>

  <div class="mines-grid" id="minesGrid" style="margin-bottom:10px;"></div>

  <div class="card">
    <div style="display:flex;gap:10px;margin-bottom:12px;">
      <div style="flex:1;">
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">Bet (₹)</label>
        <input type="number" class="input-field" id="betAmt" value="10" min="1">
      </div>
      <div style="flex:1;">
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">Mines</label>
        <select class="input-field" id="mineCount">
          <option value="1">1 Mine</option>
          <option value="3" selected>3 Mines</option>
          <option value="5">5 Mines</option>
          <option value="10">10 Mines</option>
          <option value="15">15 Mines</option>
        </select>
      </div>
    </div>
    <div id="alertBox" style="margin-bottom:8px;"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" id="startBtn" onclick="startGame()" style="flex:1;">START</button>
      <button class="btn btn-green" id="cashoutBtn" onclick="cashout()" disabled style="flex:1;opacity:0.4;">CASHOUT</button>
    </div>
  </div>
</div>
<script src="js/mines.js"></script>
</body>
</html>
